<!-- header.component.html -->
<header class="site-header">
  <div class="header-container">
    <!-- Logo Section -->
    <a routerLink="/" class="logo-wrapper">
      <div class="logo-container">
        <div class="logo-image-wrapper">
          <img 
            src="assets/images/logo.png" 
            alt="Dheeraj Global Institute" 
            class="logo-image"
          />
          <div class="logo-glow"></div>
        </div>
        <div class="school-name">
          <span class="name-god">Dheeraj</span>
          <span class="name-grace">Global</span>
          <span class="name-school">Institute</span>
        </div>
      </div>
    </a>

    <!-- Mobile Menu Toggle -->
    <button 
      class="mobile-toggle" 
      [class.active]="isMenuOpen" 
      (click)="toggleMenu()"
      aria-label="Toggle menu"
    >
      <span class="toggle-line"></span>
      <span class="toggle-line"></span>
      <span class="toggle-line"></span>
    </button>

    <!-- Navigation Menu -->
    <nav class="main-nav" [class.active]="isMenuOpen">
      <ul class="nav-list">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
            <span class="link-text">Home</span>
            <span class="link-hover-effect"></span>
          </a>
        </li>
        
        
        <li class="nav-item">
          <a routerLink="/notices" routerLinkActive="active" class="nav-link">
            <span class="link-text">Notices</span>
            <span class="link-hover-effect"></span>
          </a>
        </li>
        
        <li class="nav-item">
          <a routerLink="/events" routerLinkActive="active" class="nav-link">
            <span class="link-text">Events</span>
            <span class="link-hover-effect"></span>
          </a>
        </li>
        
        <li class="nav-item">
          <a routerLink="/gallery" routerLinkActive="active" class="nav-link">
            <span class="link-text">Gallery</span>
            <span class="link-hover-effect"></span>
          </a>
        </li>
        
        <li class="nav-item">
          <a routerLink="/teachers" routerLinkActive="active" class="nav-link">
            <span class="link-text">Teachers</span>
            <span class="link-hover-effect"></span>
          </a>
        </li>
        
        <li class="nav-item">
          <a class="nav-link" routerLink="/lost-found" routerLinkActive="active">
            <i class="fas fa-search"></i> Lost & Found
          </a>
        </li>

        <li class="nav-item">
  <a class="nav-link" routerLink="/alumni" routerLinkActive="active">
    <i class="fas fa-user-graduate"></i> Alumni
  </a>
</li>
        <!-- Mega Dropdown for More Items -->
        <li class="nav-item dropdown">
          <button class="dropdown-trigger" (click)="toggleDropdown($event)">
            <span class="link-text">More</span>
            <svg class="dropdown-icon" viewBox="0 0 24 24" width="20" height="20">
              <path d="M7 10l5 5 5-5H7z" fill="currentColor"/>
            </svg>
          </button>
          
          <div class="dropdown-menu" [class.show]="isDropdownOpen">
            <div class="dropdown-grid">
              <div class="dropdown-section">
                <h3 class="dropdown-title">Information</h3>
                <ul class="dropdown-list">
                  <li>
                    <a routerLink="/contact-us" class="dropdown-link" (click)="closeMenu()">
                      <svg class="link-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 8h12v2H6V8zm0 4h8v2H6v-2z" fill="currentColor"/>
                      </svg>
                      Contact Us
                    </a>
                  </li>
                  <li>
                    <a routerLink="/about-us" class="dropdown-link" (click)="closeMenu()">
                      <svg class="link-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" fill="currentColor"/>
                      </svg>
                      About Us
                    </a>
                  </li>
                </ul>
              </div>
              
              <div class="dropdown-section">
                <h3 class="dropdown-title">Legal</h3>
                <ul class="dropdown-list">
                  <li>
                    <a routerLink="/privacy-policy" class="dropdown-link" (click)="closeMenu()">
                      <svg class="link-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" fill="currentColor"/>
                      </svg>
                      Privacy Policy
                    </a>
                  </li>
                  <li>
                    <a routerLink="/disclaimer" class="dropdown-link" (click)="closeMenu()">
                      <svg class="link-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" fill="currentColor"/>
                      </svg>
                      Disclaimer
                    </a>
                  </li>
                </ul>
              </div>
              
              <div class="dropdown-section">
                <h3 class="dropdown-title">Admin</h3>
                <ul class="dropdown-list">
                  <li>
                    <a routerLink="/dashboard" class="dropdown-link" (click)="closeMenu()">
                      <svg class="link-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" fill="currentColor"/>
                      </svg>
                      Dashboard
                    </a>
                  </li>
                  @if(isLoggedIn()){
                  <li>
                    <a (click)="logOut(); closeMenu()" class="dropdown-link logout-link">
                      <svg class="link-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.59L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" fill="currentColor"/>
                      </svg>
                      Log Out
                    </a>
                  </li>
                  }
                </ul>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </nav>
  </div>

  <!-- Progress Bar (optional - shows on scroll) -->
  <div class="progress-bar" [style.width]="scrollProgress + '%'"></div>
</header>
